<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>titwenty-Beats</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
    header{padding:28px 20px;border-bottom:1px solid #222}
    .wrap{max-width:1100px;margin:auto}
    h1{margin:0 0 8px;font-size:32px}
    .muted{color:#999}
    main{padding:24px 20px}
    .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
    input,select,button{border:1px solid #333;background:#15151b;color:#fff;padding:12px;border-radius:10px}
    input{min-width:240px}
    button{cursor:pointer}
    button:hover{background:#22222b}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .card{background:#121218;border:1px solid #25252d;border-radius:16px;padding:16px}
    .card h3{margin:0 0 8px}
    audio{width:100%;margin:12px 0}
    .meta{font-size:13px;color:#999}
    .admin{margin-top:35px;padding:18px;border:1px solid #292933;border-radius:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
    #status{margin-top:10px;color:#aaa}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>titwenty-Beats</h1>
    <div class="muted">Beats for artists</div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <input id="search" placeholder="Поиск бита...">
    <select id="genre"><option value="">Все жанры</option></select>
  </div>

  <div id="beats" class="grid"></div>

  <section class="admin">
    <h2>Админка</h2>
    <div class="row">
      <input id="password" type="password" placeholder="ADMIN_PASSWORD">
    </div>
    <div class="row">
      <input id="file" type="file" accept="audio/*">
      <input id="name" placeholder="Название бита">
      <input id="bpm" placeholder="BPM">
      <input id="genreInput" placeholder="Жанр">
      <button id="upload">Загрузить</button>
    </div>
    <div id="status"></div>
  </section>
</main>

<script>
let beats = [];

async function load() {
  const r = await fetch("/api/beats");
  beats = await r.json();
  const genres = [...new Set(beats.map(x => x.genre).filter(Boolean))].sort();
  genre.innerHTML = '<option value="">Все жанры</option>' +
    genres.map(g => `<option>${escapeHtml(g)}</option>`).join("");
  render();
}

function render() {
  const q = search.value.toLowerCase();
  const g = genre.value;
  const filtered = beats.filter(b =>
    (!q || b.name.toLowerCase().includes(q)) &&
    (!g || b.genre === g)
  );

  document.getElementById("beats").innerHTML = filtered.map(b => `
    <article class="card">
      <h3>${escapeHtml(b.name)}</h3>
      <div class="meta">${escapeHtml(b.genre)}${b.bpm ? " · " + escapeHtml(b.bpm) + " BPM" : ""}</div>
      <audio controls preload="none" src="${b.url}"></audio>
    </article>
  `).join("") || '<div class="muted">Битов пока нет.</div>';
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

search.oninput = render;
genre.onchange = render;

upload.onclick = async () => {
  const fileEl = document.getElementById("file");
  const file = fileEl.files[0];
  if (!file) return status.textContent = "Выбери аудиофайл.";

  const fd = new FormData();
  fd.append("file", file);
  fd.append("name", name.value || file.name);
  fd.append("genre", genreInput.value || "Other");
  fd.append("bpm", bpm.value || "");

  status.textContent = "Загрузка...";
  const r = await fetch("/api/upload", {
    method: "POST",
    headers: { Authorization: "Bearer " + password.value },
    body: fd
  });

  status.textContent = r.ok ? "Готово!" : "Ошибка: " + await r.text();
  if (r.ok) {
    fileEl.value = "";
    await load();
  }
};

load().catch(e => {
  document.getElementById("beats").innerHTML =
    '<div class="muted">Ошибка загрузки каталога: ' + escapeHtml(e.message) + '</div>';
});
</script>
</body>
</html>
