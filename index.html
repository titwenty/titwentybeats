<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>titwenty-Beats</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#09090c;color:#f5f5f5;font-family:Inter,Arial,sans-serif}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{padding:42px 0 30px;border-bottom:1px solid #202026}
.logo{font-size:34px;font-weight:800;letter-spacing:-1px}
.sub{color:#8d8d98;margin-top:7px}
main{padding:28px 0 60px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
input,select,button{font:inherit;border:1px solid #292931;background:#131319;color:#fff;border-radius:11px;padding:12px 14px}
input{min-width:220px}
button{cursor:pointer}
button:hover{background:#1b1b23}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{border:1px solid #24242c;background:#111116;border-radius:17px;padding:17px}
.card h3{margin:0 0 7px;font-size:18px}
.meta{color:#888894;font-size:13px}
audio{display:block;width:100%;margin-top:14px}
.admin{margin-top:38px;border:1px solid #24242c;border-radius:17px;padding:18px}
.admin h2{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.status{color:#999;margin-top:10px;white-space:pre-wrap}
.empty{color:#777}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">titwenty-Beats</div>
  <div class="sub">Beats for artists</div>
</div></header>

<main class="wrap">
  <div class="tools">
    <input id="search" placeholder="Поиск бита">
    <select id="genre"><option value="">Все жанры</option></select>
  </div>
  <div id="beats" class="grid"><div class="empty">Загрузка...</div></div>

  <section class="admin">
    <h2>Загрузка бита</h2>
    <div class="row">
      <input id="password" type="password" placeholder="Пароль администратора">
    </div>
    <div class="row">
      <input id="file" type="file" accept="audio/mpeg,audio/wav,audio/x-wav,audio/*">
      <input id="name" placeholder="Название">
      <input id="bpm" placeholder="BPM">
      <input id="genreInput" placeholder="Жанр">
      <button id="upload">Загрузить</button>
    </div>
    <div id="status" class="status"></div>
  </section>
</main>

<script>
let beats=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function load(){
  const r=await fetch("/api/beats",{cache:"no-store"});
  if(!r.ok) throw new Error(await r.text());
  beats=await r.json();
  const genres=[...new Set(beats.map(b=>b.genre).filter(Boolean))].sort();
  $("genre").innerHTML='<option value="">Все жанры</option>'+genres.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
  render();
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const g=$("genre").value;
  const list=beats.filter(b=>
    (!q||String(b.name).toLowerCase().includes(q)) &&
    (!g||b.genre===g)
  );
  $("beats").innerHTML=list.length?list.map(b=>`
    <article class="card">
      <h3>${esc(b.name)}</h3>
      <div class="meta">${esc(b.genre)}${b.bpm?` · ${esc(b.bpm)} BPM`:""}</div>
      <audio controls preload="none" src="${esc(b.url)}"></audio>
    </article>`).join(""):'<div class="empty">Пока нет битов.</div>';
}

$("search").addEventListener("input",render);
$("genre").addEventListener("change",render);

$("upload").addEventListener("click",async()=>{
  const file=$("file").files[0];
  if(!file){$("status").textContent="Выбери аудиофайл.";return}
  if(!$("password").value){$("status").textContent="Введи пароль администратора.";return}

  const fd=new FormData();
  fd.append("file",file);
  fd.append("name",$("name").value.trim()||file.name);
  fd.append("genre",$("genreInput").value.trim()||"Other");
  fd.append("bpm",$("bpm").value.trim());

  $("status").textContent="Загрузка...";
  try{
    const r=await fetch("/api/upload",{
      method:"POST",
      headers:{Authorization:"Bearer "+$("password").value},
      body:fd
    });
    if(!r.ok) throw new Error(await r.text());
    $("status").textContent="Бит загружен.";
    $("file").value=""; $("name").value=""; $("bpm").value="";
    await load();
  }catch(e){$("status").textContent="Ошибка: "+e.message}
});

load().catch(e=>{
  $("beats").innerHTML='<div class="empty">Не удалось загрузить каталог.<br><small>'+esc(e.message)+'</small></div>';
});
</script>
</body>
</html>
